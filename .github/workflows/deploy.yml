name: Build image

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you re-build by hand from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Creates a builder on the docker-container driver.
      # Without this, `cache-to: type=gha` fails with
      # "Cache export is not supported for the docker driver".
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # TEMPORARY — delete this step once the push works.
      # Prints only the LENGTH of each secret, never the value.
      # A length of 0 means the secret is missing or misnamed.
      - name: Check secrets are present
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "username length: ${#DOCKERHUB_USERNAME}"
          echo "token length:    ${#DOCKERHUB_TOKEN}"

      # Must come BEFORE the build step. Without it the push is
      # anonymous, which only has pull scope -> 401 insufficient scopes.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            anouar10/portfolio:latest
            anouar10/portfolio:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

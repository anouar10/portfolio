name: Build image

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you re-build by hand from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Creates a builder on the docker-container driver.
      # Without this, `cache-to: type=gha` fails with
      # "Cache export is not supported for the docker driver".
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Must come BEFORE the build step. Without it the push is anonymous,
      # which only has pull scope -> 401 insufficient scopes.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The namespace here MUST match the Docker Hub account (anwar123456789),
      # not the GitHub account (anouar10). Pushing to a namespace you do not
      # own is what produced the original "insufficient scopes" error.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            anwar123456789/portfolio:latest
            anwar123456789/portfolio:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

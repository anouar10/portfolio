name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you re-deploy by hand from the Actions tab

concurrency:
  group: deploy-production
  cancel-in-progress: false # never interrupt a deploy in flight

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        # no `driver:` input — the default is docker-container

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: anouar10/portfolio:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
  # ---------------------------------------------------------------------------
  deploy:
    name: Roll out to the server
    needs: build
    runs-on: ubuntu-latest
    environment: production # add a required reviewer here if you want a gate
    steps:
      - name: Set up the SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Pull the new image and restart
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          PORT: ${{ secrets.SSH_PORT }}
          DIR: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -p "$PORT" "$USER@$HOST" bash -euo pipefail <<'REMOTE'
            cd "${{ secrets.DEPLOY_PATH }}/deploy"

            # Keep the current image id so a failed rollout can be reversed.
            PREVIOUS=$(docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              images -q portfolio || true)
            echo "$PREVIOUS" > .last-good-image

            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull portfolio
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d portfolio

            docker image prune -f --filter "until=168h"
          REMOTE

      - name: Wait for the site to answer
        run: |
          for attempt in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
                   "https://${{ secrets.DOMAIN }}/healthz" || echo 000)
            if [ "$code" = "200" ]; then
              echo "Healthy after ${attempt} attempt(s)."
              exit 0
            fi
            echo "Attempt ${attempt}: got ${code}, retrying in 5s"
            sleep 5
          done
          echo "Site did not come back healthy."
          exit 1

      - name: Roll back if the health check failed
        if: failure()
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          PORT: ${{ secrets.SSH_PORT }}
        run: |
          ssh -p "$PORT" "$USER@$HOST" bash -euo pipefail <<'REMOTE'
            cd "${{ secrets.DEPLOY_PATH }}/deploy"
            PREVIOUS=$(cat .last-good-image)
            if [ -n "$PREVIOUS" ]; then
              echo "Rolling back to $PREVIOUS"
              docker tag "$PREVIOUS" ghcr.io/${{ github.repository }}:latest
              docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d portfolio
            fi
          REMOTE

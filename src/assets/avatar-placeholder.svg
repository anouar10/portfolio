<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Portrait placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F8E8A"/>
      <stop offset="55%" stop-color="#0B7F7C"/>
      <stop offset="100%" stop-color="#0A5F5D"/>
    </linearGradient>
    <linearGradient id="figure" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#EAF6F5" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#BCE3E0" stop-opacity="0.75"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="200" height="200" rx="26"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="200" height="200" fill="url(#bg)"/>

    <!-- faint grid: a nod to the tables and schemas this portfolio is about -->
    <g stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1">
      <path d="M0 50h200M0 100h200M0 150h200M50 0v200M100 0v200M150 0v200"/>
    </g>

    <!-- shoulders -->
    <path d="M28 200c0-33 32-56 72-56s72 23 72 56z" fill="url(#figure)"/>
    <!-- head -->
    <circle cx="100" cy="86" r="34" fill="url(#figure)"/>
  </g>

  <rect x="0.5" y="0.5" width="199" height="199" rx="25.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.16"/>
</svg>

# Base definition. Pulls the image built by GitHub Actions -- the server
# never compiles anything, which is the whole point of pushing to a registry.
#
# On its own this publishes no ports. Layer one of the other files on top:
#   local test :  docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
#   production :  docker compose -f docker-compose.yml -f docker-compose.prod.yml  up -d

services:
  portfolio:
    image: ${IMAGE}:${TAG:-latest}
    container_name: portfolio
    restart: unless-stopped
    pull_policy: always
    volumes:
      - nginx-logs:/var/log/nginx
    networks: [edge]

volumes:
  nginx-logs:

networks:
  edge:

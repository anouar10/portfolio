# Structured access log. JSON so you can query it with jq instead of regex.
# `ref` captures the ?ref= tag you put on each application link.
log_format json_analytics escape=json
  '{'
    '"time":"$time_iso8601",'
    '"ip":"$remote_addr",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"query":"$args",'
    '"ref":"$arg_ref",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent",'
    '"lang":"$http_accept_language",'
    '"request_time":$request_time'
  '}';

map $http_user_agent $is_bot {
  default 0;
  "~*(bot|crawl|spider|slurp|bingpreview|headless|curl|wget|python-requests)" 1;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  access_log /var/log/nginx/access.json json_analytics;
  error_log  /var/log/nginx/error.log warn;

  # --- security headers ------------------------------------------------------
  add_header X-Content-Type-Options    "nosniff"        always;
  add_header X-Frame-Options           "SAMEORIGIN"     always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

  # --- compression -----------------------------------------------------------
  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/xml font/woff2;

  # --- health check ----------------------------------------------------------
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # --- hashed build assets: safe to cache forever ----------------------------
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # --- your CV files: cache briefly so updates go live quickly ---------------
  location /cv/ {
    expires 1h;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # --- everything else: never cache the HTML shell ---------------------------
  location / {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri $uri/ /index.html;
  }
}

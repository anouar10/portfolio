server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Health endpoint. The Dockerfile HEALTHCHECK hits this, so if it is
    # missing the container is permanently marked "unhealthy".
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Single-page-app fallback: unknown paths serve index.html so client
    # side routing works on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Build tools emit content-hashed filenames, so these are safe to
    # cache aggressively.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # The entry point must never be cached, or users keep getting the old
    # app shell pointing at deleted asset filenames.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
